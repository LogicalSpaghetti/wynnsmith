<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="style.css"/>
    <title>WynnSmith</title>
    <link rel="icon" href="img/icons/w.png"/>
</head>
<body>
<div class="sidenav">
    <br>
    <button id="settings_open" class="settings_toggle">⚙</button>
</div>
<div id="content" style="margin-left: 3ch">
    <div class="flexCol">
        <!-- Column -->
        <section>
            <div class="m1">
                <div>AP: <span id="assigned_ap_display">0</span>/<span id="max_ap_display">45</span> AP</div>
                <div id="tree_errors" class="fire small-font" style="text-align: left">Error: errors not created!</div>
                <table id="ability_tree">
                    <!-- Generated by JS -->
                </table>
                <button id="clear_tree">Clear Tree</button>
                <button id="clear_reds">Clear Errors</button>
                <br>
                <button id="ansi_tree" class="copy_button" data-default="Copy ANSI Tree">Copy ANSI Tree</button>
                <br>
                <button id="tree_img" class="copy_button" data-default="Copy Tree as Image">Copy Tree as Image</button>
            </div>
        </section>
        <!-- Column -->
        <section>
            <div id="item_inputs" class="inputs_holder">
                <div class="input_cluster" data-slot="helmet" data-group="gear">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/item/helmet.png" alt="He" class="slot_img">
                    </a>
                    <input class="input item_input slot_input" placeholder="Helmet"/>
                    <input class="input powder_input" placeholder="0 Slots"/>
                </div>
                <div class="input_cluster" data-slot="chestplate" data-group="gear">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/item/chestplate.png" alt="Ch" class="slot_img">
                    </a>
                    <input class="input item_input slot_input" placeholder="Chestplate"/>
                    <input class="input powder_input" placeholder="0 Slots"/>
                </div>
                <div class="input_cluster" data-slot="leggings" data-group="gear">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/item/leggings.png" alt="Le" class="slot_img">
                    </a>
                    <input class="input item_input slot_input" placeholder="Leggings"/>
                    <input class="input powder_input" placeholder="0 Slots"/>
                </div>
                <div class="input_cluster" data-slot="boots" data-group="gear">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/item/boots.png" alt="Bo" class="slot_img">
                    </a>
                    <input class="input item_input slot_input" placeholder="Boots"/>
                    <input class="input powder_input" placeholder="0 Slots"/>
                </div>
                <div class="input_cluster" data-slot="ring" data-group="gear">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/item/ring.png" alt="Ri" class="slot_img">
                    </a>
                    <input class="input item_input slot_input" placeholder="Ring"/>
                    <div>
                        <div id="gif_holder"><img id="miku" src="" alt=""/></div>
                    </div>
                </div>
                <div class="input_cluster" data-slot="ring" data-group="gear">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/item/ring.png" alt="Ri" class="slot_img">
                    </a>
                    <input class="input item_input slot_input" placeholder="Ring"/>
                </div>
                <div class="input_cluster" data-slot="bracelet" data-group="gear">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/item/bracelet.png" alt="Br" class="slot_img">
                    </a>
                    <input class="input item_input slot_input" placeholder="Bracelet"/>
                </div>
                <div class="input_cluster" data-slot="necklace" data-group="gear">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/item/necklace.png" alt="Ne" class="slot_img">
                    </a>
                    <input class="input item_input slot_input" placeholder="Necklace"/>
                </div>
                <div class="input_cluster primary_weapon_cluster" data-slot="weapon" data-group="weapon">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/item/archer.png" alt="We" class="slot_img">
                    </a>
                    <input class="input item_input slot_input" placeholder="Weapon"/>
                    <input class="input powder_input" placeholder="0 Slots"/>
                </div>
                <label for="level_input">Level:</label>
                <input type="number" inputmode="numeric"
                       min="1" max="106"
                       id="level_input" class="input level_input hide_number_increment" placeholder="level"
                       value="106"/>
                <br>
                Offhands:
                <button id="add_offhand">+</button>

                <div class="offhands">
                    <!-- Generated by JS -->
                </div>
            </div>
            <br>
            <div class="copy_buttons">
                <button id="copy_short" class="copy_button" data-default="Copy Link">Copy Link</button>
                <button id="copy_long" class="copy_button" data-default="Share Build">Share Build</button>
            </div>
            <br>
            <div id="sp_section" style="display: flex">
                <div class="sp_cluster" data-element="earth" style="text-align: center;">
                    <b class="font-minecraft earth" style="display: inline-block; width: 1ch">✤</b>
                    <span class="total_display earth">0</span>
                    <div class="small-font">Assign: <span class="assigned_display">0</span></div>
                    <div class="small-font">Modify:</div>
                    <input class="input sp_input"/>
                </div>
                <div class="sp_cluster" data-element="thunder" style="text-align: center;">
                    <b class="font-minecraft thunder" style="display: inline-block; width: 1ch">✦</b>
                    <span class="total_display thunder">0</span>
                    <div class="small-font">Assign: <span class="assigned_display">0</span></div>
                    <div class="small-font">Modify:</div>
                    <input class="input sp_input"/>
                </div>
                <div class="sp_cluster" data-element="water" style="text-align: center;">
                    <b class="font-minecraft water" style="display: inline-block; width: 1ch">❉</b>
                    <span class="total_display water">0</span>
                    <div class="small-font">Assign: <span class="assigned_display">0</span></div>
                    <div class="small-font">Modify:</div>
                    <input class="input sp_input"/>
                </div>
                <div class="sp_cluster" data-element="fire" style="text-align: center;">
                    <b class="font-minecraft fire" style="display: inline-block; width: 1ch">✹</b>
                    <span class="total_display fire">0</span>
                    <div class="small-font">Assign: <span class="assigned_display">0</span></div>
                    <div class="small-font">Modify:</div>
                    <input class="input sp_input"/>
                </div>
                <div class="sp_cluster" data-element="air" style="text-align: center;">
                    <b class="font-minecraft air" style="display: inline-block; width: 1ch">❋</b>
                    <span class="total_display air">0</span>
                    <div class="small-font">Assign: <span class="assigned_display">0</span></div>
                    <div class="small-font">Modify:</div>
                    <input class="input sp_input"/>
                </div>

            </div>
            Remaining SP: <span id="remaining_sp">200</span>
            <br>
            <button id="balance_dmg">Balance Str/Dex</button>
            <br>
            <div id="effects_holder" style="width: 24ch">
                <div style="text-align: center">
                    <label for="effect_toggles">Active Effects:</label>
                </div>
                <div id="effect_toggles">
                    <!-- Generated by JS -->
                </div>
                <div id="effect_sliders">
                    <!-- Generated by JS -->
                </div>
            </div>
            <br>
            <div id="tome_inputs">
                <div class="input_cluster" data-slot="guild_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/guild.png" alt="Gu" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Guild Tome"/>
                </div>
                <div class="input_cluster" data-slot="lootrun_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/lootrun.png" alt="Lr" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Lootrun Tome"/>
                </div>
                <div class="input_cluster" data-slot="armour_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/armour.png" alt="Ar" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Armour Tome"/>
                </div>
                <div class="input_cluster" data-slot="armour_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/armour.png" alt="Ar" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Armour Tome"/>
                </div>
                <div class="input_cluster" data-slot="armour_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/armour.png" alt="Ar" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Armour Tome"/>
                </div>
                <div class="input_cluster" data-slot="armour_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/armour.png" alt="Ar" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Armour Tome"/>
                </div>
                <div class="input_cluster" data-slot="mysticism_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/mysticism.png" alt="My" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Mysticism Tome"/>
                </div>
                <div class="input_cluster" data-slot="mysticism_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/mysticism.png" alt="My" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Mysticism Tome"/>
                </div>
                <div class="input_cluster" data-slot="weapon_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/weapon.png" alt="We" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Weapon Tome"/>
                </div>
                <div class="input_cluster" data-slot="weapon_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/weapon.png" alt="We" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Weapon Tome"/>
                </div>
                <div class="input_cluster" data-slot="expertise_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/expertise.png" alt="Ex" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Expertise Tome"/>
                </div>
                <div class="input_cluster" data-slot="expertise_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/expertise.png" alt="Ex" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Expertise Tome"/>
                </div>
                <div class="input_cluster" data-slot="marathon_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/marathon.png" alt="Ma" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Marathon Tome"/>
                </div>
                <div class="input_cluster" data-slot="marathon_tome" data-group="tome">
                    <a class="item_link" target="_blank" tabIndex="-1">
                        <img src="img/tomes/marathon.png" alt="Ma" class="slot_img">
                    </a>
                    <input class="input item_input tome_input" placeholder="Marathon Tome"/>
                </div>
            </div>
            <br>
            <div id="aspects_background" style="margin-left: 1ch">
                <div id="active_aspects">
                    <!-- Generated by JS -->
                </div>
                <div id="inactive_aspects">
                    <!-- Generated by JS -->
                </div>
            </div>
        </section>
        <!-- Column -->
        <section class="m1">
            <div id="support_display">
                <!-- Generated by JS -->
            </div>
            <br>
            <button id="edit_ids">Edit Identifications</button>
            <br>
            <br>
            <div id="equip_order" class="attack-holder" style="line-height: 150%;"></div>
        </section>
        <!-- Column -->
        <section>
            <div class="m1">
                <p id="attack_display"></p>
            </div>
        </section>
    </div>
    <br>
    <div class="font-minecraft m1">
        related websites:
        <a href="https://punscake.github.io/wynnability" target="_blank">Wynnability</a>,
        <a href="https://wynnmana.github.io/" target="_blank">Wynnmana</a>,
        <a href="https://api.wynncraft.com/v3/item/database?fullResult" target="_blank">Wynncraft Item API</a>
    </div>
</div>
<div
        id="settings"
        class="hide_section"
        style="text-align: center; background-color: var(--ls-background2); min-height: 100vh"
>
    <button id="selv">Toggle Selvs</button>
    <br><br>
    <button id="detailed_damage">Toggle Detailed Damage</button>
    <br><br>
    <label for="gif_input">Set GIF:</label><br>
    <input id="gif_input" type="file" accept="image/gif"/>
    <br>
    <br>
    <label for="opacity_slider">GIF Opacity:</label>
    <div>
        <input id="opacity_slider" class="slider" type="range" value="15" style="width: 210px"/>
    </div>
    <br>
    <button id="settings_close" class="settings_toggle">Close Settings</button>
    <br><br><br><br>
    <div id="dev_output" class="output font-minecraft"></div>
</div>

<script src="src/read_write/item_search.js"></script>
<script src="src/read_write/read.js"></script>
<script src="src/read_write/write.js"></script>

<script src="src/permute/minecraft_html.js"></script>
<script src="src/data/code_dictionary.js"></script>

<script src="src/data/items.js"></script>
<script src="src/data/trees.js"></script>
<script src="src/data/effects.js"></script>
<script src="src/data/base_and_ids.js"></script>
<script src="src/data/small_stuff.js"></script>
<script src="src/control/preloading.js"></script>

<script src="src/control/script.js"></script>
<script src="src/control/tooltip.js"></script>
<script src="src/permute/permute.js"></script>
<script src="src/permute/attack_calculations.js"></script>
<script src="src/permute/stat_calculations.js"></script>
<script src="src/read_write/build_linking.js"></script>
<script src="src/read_write/get_items.js"></script>
<script src="src/data/aspects.js"></script>
<script src="src/data/major_ids.js"></script>
<script src="src/read_write/ability_tree.js"></script>
<script src="src/read_write/toggles.js"></script>
<script src="src/permute/effect_parsing.js"></script>
<script src="src/permute/identifications.js"></script>
<script src="src/control/event_listeners.js"></script>

<script src="src/read_write/display_item.js"></script>
<script src="src/read_write/display_stats.js"></script>
<script src="src/read_write/display_damage.js"></script>
<script src="src/read_write/image_exporting.js"></script>
<script src="src/control/settings.js"></script>

<script src="lib/html2canvas.min.js"></script>

</body>
</html>
