name: Update personal website with changes.

on:
  push:
    branches: [ main ]

jobs:
  SFTP-Deploy-Action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite site
        run: npm run build

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USER }}
          server: ${{ secrets.FTP_HOST }}
          ssh_private_key: ${{ secrets.FTP_PASSWORD }} # TODO: look into SSH keys
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22

          local_path: ./dist/*
          remote_path: ./wynnsmith/

          sftp_only: true
          sftpArgs: '-o StrictHostKeyChecking=no -o ConnectTimeout=10'
