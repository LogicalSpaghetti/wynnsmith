name: Update personal website with changes.

on:
  push:
    branches: [ main ]

jobs:
  SFTP-Deploy-Action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite site
        run: npm run build

      - name: Install lftp
        run: sudo apt update && sudo apt install -y lftp

      - name: Deploy dist/ contents to wynnsmith/
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes
            open -u ${{ secrets.FTP_USER }},\$LFTP_PASSWORD sftp://${{ secrets.FTP_HOST }}:22
            cd ./wynnsmith || mkdir -p ./wynnsmith && cd ./wynnsmith
            lcd ./dist
            mirror --reverse --delete --parallel=4 --verbose \
              --exclude .git* --exclude *.map --exclude node_modules \
              ./
            bye
          "
