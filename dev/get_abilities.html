<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ability Yoinker</title>
    <style>
        @font-face {
            font-family: 'common';
            src:  url('https://cdn.wynncraft.com/nextgen/fonts/common.woff');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        .font-common {
            font-family: 'common',serif;
        }

        .minecraftTooltip {
          padding: 1px 5px 1px 5px;
          border: 2px solid #230158;
          background-color: #110111;
          color: white;
          min-height: 30px;
          border-radius: 4px;
          word-spacing: 3px;
        }
    </style>
  </head>
  <body>
    <form>

        <div class="d-flex justify-content-start align-items-center ps-2 pe-2">

          <!-- Prevent implicit submission of the form -->
          <button type="submit" hidden></button>

          <button type="button" onclick="load()" class="btn btn-primary me-2" title="From a JSON pasted into the field on the right">Load</button>

          <input type="text" id="json-container" class="me-2 overflow-hidden" style="min-width: 40px" onfocus="this.select()">

        </div>

      </form>

      <div id="body">

      </div>
  </body>
  <script>
    function load() {
        const text = document.getElementById("json-container").value;

        let obj = {};

        try {
            obj = JSON.parse(text);
        } catch (error) {
            throw ("Couldn't parse");
        }

        let pages = obj.pages;

        for (let page of Object.keys(pages)) {

            const pagediv = document.createElement("div");
            pagediv.style = 'width: 100%';

            const pagenum = document.createElement("div");
            pagenum.style = 'width: 100%; background-color: black; color: white';
            pagenum.innerHTML = `Page #${page}`;
            pagediv.appendChild(pagenum);

            let abilities = pages[page];
            for (let abilitykey of Object.keys(abilities)) {
                const ability = abilities[abilitykey];

                let description = "";

                const abilitydiv = document.createElement("div");
                abilitydiv.classList.add('minecraftTooltip');
                abilitydiv.style = 'margin: 5px; display: inline-block; vertical-align: top; font-family: common';
                //abilitydiv.innerHTML = ability.name + "<br>";

                description += ability.name//abilitydiv.textContent || abilitydiv.innerText || "";

                for (let line of ability['description']) {
                    //abilitydiv.innerHTML = line;
                    description += "<br>" + line;
                    //description += abilitydiv.textContent || abilitydiv.innerText || "";
                }

                abilitydiv.innerHTML = description;
                pagediv.appendChild(abilitydiv);
            }

            document.getElementById("body").appendChild(pagediv);
        }
    }
  </script>
</html>
